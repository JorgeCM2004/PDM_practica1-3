[project]
name = "pdm-practica1-3"
version = "0.1.0"
description = "Detección y conteo por fotograma con LiDAR de infraestructura UrbanIng-V2X"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "py7zr>=1.1.3",
    "urbaning>=1.0.1",
    "shapely>=2.1.2",
    "pyproj>=3.8.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]
video = [
    "imageio-ffmpeg>=0.6.0",
]
